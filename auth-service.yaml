apiVersion: v1
kind: ConfigMap
metadata:
  name: auth-service-config
  namespace: dev
data:
  PORT: "3001"
  ADMIN_USERNAME: "admin"
  ADMIN_EMAIL: "admin@sneakertail.com"
  DEMO_USERNAME: "user"
  DEMO_EMAIL: "user@sneakertail.com"
---
apiVersion: v1
kind: Secret
metadata:
  name: auth-service-secret
  namespace: dev
type: Opaque
stringData:
  JWT_SECRET: "replace-with-cluster-secret"
  ADMIN_PASSWORD: "replace-with-cluster-secret"
  DEMO_PASSWORD: "replace-with-cluster-secret"
---

apiVersion: v1
kind: Service
metadata:
  name: auth-service-active
  namespace: dev
spec:
  selector:
    app: auth-service
  ports:
    - name: http
      port: 3001
      targetPort: 3001

---

apiVersion: v1
kind: Service
metadata:
  name: auth-service-preview
  namespace: dev
spec:
  selector:
    app: auth-service
  ports:
    - name: http
      port: 3001
      targetPort: 3001

---

apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: auth-service
  namespace: dev
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: auth-service
  strategy:
    blueGreen:
      activeService: auth-service-active
      previewService: auth-service-preview
      autoPromotionEnabled: false
      previewReplicaCount: 1
      scaleDownDelaySeconds: 30
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: ghcr.io/sneakertail/auth-service:dev
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3001
          envFrom:
            - configMapRef:
                name: auth-service-config
            - secretRef:
                name: auth-service-secret
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
