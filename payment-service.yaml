apiVersion: v1
kind: ConfigMap
metadata:
  name: payment-service-config
  namespace: k8s
data:
  PORT: "3005"
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service-active
  namespace: k8s
spec:
  selector:
    app: payment-service
  ports:
    - name: http
      port: 3005
      targetPort: 3005
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: k8s
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
    spec:
      containers:
        - name: payment-service
          image: ghcr.io/sneakertail/payment-service:dev
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3005
          envFrom:
            - configMapRef:
                name: payment-service-config
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
