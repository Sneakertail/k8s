apiVersion: v1
kind: ConfigMap
metadata:
  name: raffle-service-config
  namespace: k8s
data:
  PORT: "3003"
  REDIS_URL: "redis://redis:6379"
---
apiVersion: v1
kind: Service
metadata:
  name: raffle-service-active
  namespace: k8s
spec:
  selector:
    app: raffle-service
  ports:
    - name: http
      port: 3003
      targetPort: 3003
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: raffle-service
  namespace: k8s
spec:
  replicas: 2
  selector:
    matchLabels:
      app: raffle-service
  template:
    metadata:
      labels:
        app: raffle-service
    spec:
      containers:
        - name: raffle-service
          image: ghcr.io/sneakertail/raffle-service:dev
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3003
          envFrom:
            - configMapRef:
                name: raffle-service-config
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
